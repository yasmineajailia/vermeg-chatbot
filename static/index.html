<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERBOT - Vermeg Chatbot</title>
    <link rel="icon" type="image/png" href="/static/VERBOT.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1b3c87;
            --secondary: #3366cc;
            --accent: #5c85d6;
            --light: #f5f7fa;
            --dark: #2c3e50;
            --success: #28a745;
            --shadow: rgba(0, 0, 0, 0.1);
            --bg-gradient-start: #f5f7fa;
            --bg-gradient-end: #e4eaf5;
            --chat-bg: white;
            --message-bg: #f5f7fa;
            --border-color: #e1e5e9;
        }
        
        [data-theme="dark"] {
            --primary: #2a5caa;
            --secondary: #4477dd;
            --accent: #6d9de8;
            --light: #2c3e50;
            --dark: #ecf0f1;
            --success: #28a745;
            --shadow: rgba(0, 0, 0, 0.3);
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
            --chat-bg: #0f3460;
            --message-bg: #1a2a4e;
            --border-color: #2a4a7e;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s ease, color 0.3s ease;
        }
        
        .chat-container {
            background: var(--chat-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 16px;
            box-shadow: 0 8px 30px var(--shadow);
            overflow: hidden;
            transition: background 0.3s ease;
        }
        
        .chat-header {
            background: var(--primary);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .chat-header-left {
            display: flex;
            align-items: center;
        }
        
        .chat-header img {
            height: 60px;
            margin-right: 20px;
        }
        
        .chat-header h2 {
            font-weight: 600;
            font-size: 1.5rem;
        }
        
        .theme-toggle {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: background 0.3s ease;
        }
        
        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        #chatbox {
            height: 400px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--chat-bg);
            transition: background 0.3s ease;
        }
        
        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            position: relative;
            animation: fadeIn 0.3s ease;
            line-height: 1.5;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .user-message {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .bot-message {
            align-self: flex-start;
            background: var(--message-bg);
            color: var(--dark);
            border-bottom-left-radius: 4px;
            transition: background 0.3s ease, color 0.3s ease;
        }
        
        .bot-message p {
            margin-bottom: 12px;
        }
        
        .bot-message p:last-child {
            margin-bottom: 0;
        }
        
        .bot-message ul {
            padding-left: 20px;
            margin: 8px 0;
        }
        
        .bot-message li {
            margin-bottom: 6px;
            list-style-type: disc;
        }
        
        .bot-message li:last-child {
            margin-bottom: 0;
        }
        
        .citations {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
            opacity: 0.8;
            transition: border-color 0.3s ease;
        }
        
        .citation-title {
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--accent);
        }
        
        .citation-item {
            display: inline-block;
            background: rgba(92, 133, 214, 0.1);
            padding: 2px 8px;
            margin: 2px;
            border-radius: 8px;
            font-size: 0.8rem;
        }
        
        .chat-input {
            display: flex;
            padding: 20px;
            background: var(--chat-bg);
            border-top: 1px solid var(--border-color);
            transition: background 0.3s ease, border-color 0.3s ease;
        }
        
        #user-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border 0.3s ease, background 0.3s ease, color 0.3s ease;
            background: var(--chat-bg);
            color: var(--dark);
        }
        
        #user-input:focus {
            border-color: var(--accent);
        }
        
        #send-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            margin-left: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.3s ease;
        }
        
        #send-btn:hover {
            background: var(--secondary);
        }
        
        #send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .typing {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 12px 18px;
            border-radius: 18px;
            background: var(--message-bg);
            max-width: fit-content;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            transition: background 0.3s ease;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--secondary);
            border-radius: 50%;
            animation: typing 1.5s infinite;
        }
        
        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }
        
        @media (max-width: 768px) {
            .chat-container {
                height: 100vh;
                border-radius: 0;
                max-width: 100%;
            }
            
            body {
                padding: 0;
            }
            
            .message {
                max-width: 90%;
            }
            
            .chat-header h2 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="chat-header-left">
                <img src="/static/VERBOT.png" alt="VERBOT Logo">
                <h2>VERBOT - Vermeg Intelligent Assistant</h2>
            </div>
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
                🌙
            </button>
        </div>
        <div id="chatbox">
            <div class="message bot-message">
                Hello! I'm VERBOT, Vermeg's AI assistant. How can I help you today?
            </div>
        </div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Ask VERBOT anything about Vermeg..." />
            <button id="send-btn">Send</button>
        </div>
    </div>
    <script>
        const chatbox = document.getElementById('chatbox');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const themeToggle = document.getElementById('theme-toggle');

        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        themeToggle.textContent = currentTheme === 'dark' ? '☀️' : '🌙';

        themeToggle.addEventListener('click', () => {
            const theme = document.documentElement.getAttribute('data-theme');
            const newTheme = theme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });

        function appendMessage(sender, text, citations = []) {
            const messageDiv = document.createElement('div');
            messageDiv.className = sender === 'You' ? 'message user-message' : 'message bot-message';
            
            let formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            if (sender === 'Bot') {
                formattedText = formattedText.replace(/•\s+(.*?)(?=(?:•|\n\n|$))/g, '<li>$1</li>');
                
                if (formattedText.includes('<li>')) {
                    formattedText = formattedText.replace(/<li>.*?<\/li>/gs, match => '<ul>' + match + '</ul>');
                }
                
                formattedText = '<p>' + formattedText.replace(/\n\n+/g, '</p><p>') + '</p>';
                formattedText = formattedText.replace(/\n(?!<\/p>)/g, '<br>');
                formattedText = formattedText.replace(/<p>\s*<\/p>/g, '');
            }
            
            messageDiv.innerHTML = formattedText;
            
            if (citations && citations.length > 0) {
                const citationsDiv = document.createElement('div');
                citationsDiv.className = 'citations';
                citationsDiv.innerHTML = '<div class="citation-title">📚 Sources:</div>';
                citations.forEach(citation => {
                    const citationSpan = document.createElement('span');
                    citationSpan.className = 'citation-item';
                    citationSpan.textContent = citation.source.replace('.pdf', '').replace(/-/g, ' ');
                    citationsDiv.appendChild(citationSpan);
                });
                messageDiv.appendChild(citationsDiv);
            }
            
            chatbox.appendChild(messageDiv);
            chatbox.scrollTop = chatbox.scrollHeight;
            return messageDiv;
        }
        
        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing';
            typingDiv.id = 'typing-indicator';
            typingDiv.innerHTML = `
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            `;
            chatbox.appendChild(typingDiv);
            chatbox.scrollTop = chatbox.scrollHeight;
        }
        
        function removeTyping() {
            const typingIndicator = document.getElementById('typing-indicator');
            if (typingIndicator) {
                chatbox.removeChild(typingIndicator);
            }
        }

        async function sendMessage() {
            const question = userInput.value.trim();
            if (!question) return;
            
            appendMessage('You', question);
            userInput.value = '';
            sendBtn.disabled = true;
            
            showTyping();
            
            try {
                const response = await fetch('/ask/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });
                
                removeTyping();
                
                const botMessageDiv = document.createElement('div');
                botMessageDiv.className = 'message bot-message';
                chatbox.appendChild(botMessageDiv);
                
                let fullText = '';
                let citations = [];
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = JSON.parse(line.slice(6));
                            
                            if (data.type === 'token') {
                                fullText += data.content;
                                let formattedText = fullText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                                formattedText = formattedText.replace(/•\s+(.*?)(?=(?:•|\n\n|$))/g, '<li>$1</li>');
                                if (formattedText.includes('<li>')) {
                                    formattedText = formattedText.replace(/<li>.*?<\/li>/gs, match => '<ul>' + match + '</ul>');
                                }
                                formattedText = '<p>' + formattedText.replace(/\n\n+/g, '</p><p>') + '</p>';
                                formattedText = formattedText.replace(/\n(?!<\/p>)/g, '<br>');
                                formattedText = formattedText.replace(/<p>\s*<\/p>/g, '');
                                
                                botMessageDiv.innerHTML = formattedText;
                                chatbox.scrollTop = chatbox.scrollHeight;
                            } else if (data.type === 'citations') {
                                citations = data.content;
                            }
                        }
                    }
                }
                
                if (citations && citations.length > 0) {
                    const citationsDiv = document.createElement('div');
                    citationsDiv.className = 'citations';
                    citationsDiv.innerHTML = '<div class="citation-title">📚 Sources:</div>';
                    citations.forEach(citation => {
                        const citationSpan = document.createElement('span');
                        citationSpan.className = 'citation-item';
                        citationSpan.textContent = citation.source.replace('.pdf', '').replace(/-/g, ' ');
                        citationsDiv.appendChild(citationSpan);
                    });
                    botMessageDiv.appendChild(citationsDiv);
                }
                
            } catch (error) {
                removeTyping();
                appendMessage('Bot', 'Sorry, I encountered an error. Please try again.');
                console.error('Error:', error);
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.onclick = sendMessage;
        
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !sendBtn.disabled) {
                sendMessage();
            }
        });
        
        userInput.focus();
    </script>
</body>
</html>
